{% extends "base.html" %}
{% block title %}Sub-Account Opened{% endblock %}
{% block heading %}Sub-Account Opened{% endblock %}
{% block body %}
<table border="0" cellpadding="3"><tr><td class="c4">The sub-account has been opened.</td></tr></table>
<table border="1" cellpadding="3" cellspacing="0" class="c5">
<tr><td class="c2">Confirmation No.</td><td>{{ conf }}</td></tr>
<tr><td class="c2">Product</td><td>{{ product_name }}</td></tr>
<tr><td class="c2">Nickname</td><td>{{ nick }}</td></tr>
</table>
<table border="0" cellpadding="2"><tr><td><a href="/member?mno={{ mno }}">Return to Member</a></td></tr></table>
{% endblock %}
